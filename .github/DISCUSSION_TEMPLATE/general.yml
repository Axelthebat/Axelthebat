title: ""
labels: ["discussion"]
body:
  - type: markdown
    attributes:
      value: |
        ## Welcome

        This is the discussion board for my open-source work: security tooling, Linux and networking, and cloud infrastructure.

        ### Choosing a category

        | Category | Use it for |
        |---|---|
        | Q&A | Questions about a tool, a stack, or a security concept |
        | Ideas | Feature requests and design proposals |
        | Show and tell | Your own labs, tools, and write-ups |
        | General | Everything else |
        | Announcements | Releases and project news |

        ### Before you post

        1. Search first. Many questions are already answered in an existing thread.
        2. Redact secrets. Do not paste real tokens, credentials, private keys, customer data, or production IPs. Use placeholders such as `192.0.2.10` or `ghp_XXXX`.
        3. Report vulnerabilities privately through [SECURITY.md](https://github.com/Axelthebat/Axelthebat/blob/main/SECURITY.md). Do not open a public issue or discussion for a vulnerability.
        4. File bugs as issues using the templates, so I can reproduce them.
        5. Keep it respectful. This is a small space.

        ### What to include

        For questions about a specific tool, include:

        - Your OS and version (`uname -a`, `cat /etc/os-release`)
        - The tool version (`--version`)
        - The exact command and the complete error output
        - What you have already tried

        ### About this space

        I work mostly in Rust, Go, and Python against Linux, containers, and cloud environments. Everything here is side-project work outside my day job, so replies may take a day or two.

        You can also reach me on [GitHub](https://github.com/Axelthebat) or open an issue on the relevant repository.
  - type: input
    id: topic
    attributes:
      label: Topic
      description: One or two words, such as eBPF, OCI, WireGuard, or CI.
      placeholder: e.g. eBPF
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: OS and version, tool version, the exact command, and the full error output. Redact secrets.
      placeholder: |
        OS: Ubuntu 24.04
        Tool version: 0.1.0
        Command:
        $ batgrep --json
        Error:
        ...
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you already tried
      description: Documentation pages, flags, related threads, other tools.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Before posting
      options:
        - label: I searched existing discussions and issues
          required: true
        - label: I removed credentials, tokens, private keys, and real IPs from this post
          required: true
        - label: This is not a vulnerability report
          required: false
