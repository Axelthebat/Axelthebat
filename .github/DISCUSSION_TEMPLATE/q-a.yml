title: "[Q] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        ## Questions

        Ask away. The more context you give me, the faster I can give you a real answer.

        Always include:

        - OS and version (`uname -a`, `cat /etc/os-release`)
        - Tool version (`--version`)
        - The exact command you ran
        - The complete error output, not a screenshot of the last line
        - What you have already tried

        Redact credentials, API tokens, private keys, customer data, internal hostnames, and production IPs. Use placeholders such as `192.0.2.10` or `ghp_XXXX`.

        If you found a security bug in one of my tools, do not post it here. Report it privately through [SECURITY.md](https://github.com/Axelthebat/Axelthebat/blob/main/SECURITY.md).
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to achieve, and where are you stuck?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, version, tool version, and whether you run it in a container, a VM, or bare metal.
      placeholder: |
        OS: Ubuntu 24.04 (kernel 6.8)
        Tool: 0.1.0
        Runtime: Docker 27 on OCI Ampere A1
    validations:
      required: true
  - type: textarea
    id: attempt
    attributes:
      label: What you ran and what happened
      description: The command and the complete output.
      render: bash
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Before posting
      options:
        - label: I searched existing discussions and issues first
          required: true
        - label: I removed all secrets and real IPs from this post
          required: true
